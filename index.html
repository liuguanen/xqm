<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运大转盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(145deg, #0b0b1f 0%, #1f1a3a 70%, #2a1e3f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f0e6d0;
            overflow-x: hidden;
            position: relative;
        }

        /* 华丽光晕背景 */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 184, 0, 0.12) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(200, 160, 255, 0.15) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            text-align: center;
            max-width: 1100px;
            width: 100%;
            background: rgba(18, 12, 33, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 200, 100, 0.25);
            border-radius: 60px;
            padding: 30px 30px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 204, 0, 0.15) inset;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 56px;
            margin-bottom: 15px;
            font-weight: 800;
            background: linear-gradient(135deg, #fdbb6b, #ff9a5a, #f98b60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 15px #ff7b00, 0 0 30px #ffaa33;
            letter-spacing: 3px;
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 40px;
            margin: 20px 0 20px;
        }

        .wheel-container {
            flex: 0 1 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 20px 30px #00000080);
        }

        .wheel {
            width: 350px;
            height: 350px;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.23, 1, 0.32, 1);
            transform: rotate(0deg);
            box-shadow: 0 0 0 6px #e3b27c, 0 0 0 12px #b48b5a, 0 20px 40px black;
            background: #321f0e;
        }

        /* 转盘扇形 — 高级晶石色 */
        .wheel-section {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: bottom right;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 55px;
            font-weight: 700;
            font-size: 15px;
            color: #1a1122;
            text-shadow: 0 2px 4px rgba(255, 240, 160, 0.7);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 8px rgba(0,0,0,0.4) inset;
            letter-spacing: 0.5px;
        }

        .wheel-section:nth-child(1) { background: #ffaaa5; }  /* 珊瑚 */
        .wheel-section:nth-child(2) { background: #b8e0b4; }  /* 薄荷 */
        .wheel-section:nth-child(3) { background: #b2c9ff; }  /* 淡紫蓝 */
        .wheel-section:nth-child(4) { background: #ffe28c; }  /* 奶油黄 */
        .wheel-section:nth-child(5) { background: #dcb5ff; }  /* 浅紫 */
        .wheel-section:nth-child(6) { background: #9ed9e6; }  /* 天湖蓝 */

        /* 指针 — 华丽立体 */
        .pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            z-index: 25;
            filter: drop-shadow(0 10px 8px #2a0f0f);
        }
        .pointer::before {
            content: '';
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 26px solid transparent;
            border-right: 26px solid transparent;
            border-bottom: 48px solid #e03a3a;
            filter: drop-shadow(0 8px 5px #3b1a1a);
        }
        .pointer::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 30% 30%, #ffdb8a, #c0691e);
            border-radius: 50%;
            border: 4px solid #ffbc6e;
            box-shadow: 0 0 16px gold;
        }

        /* 中心logo — 闪耀宝石 */
        .center-logo {
            position: absolute;
            width: 78px;
            height: 78px;
            background: radial-gradient(circle at 30% 30%, #ffcf9a, #b7772e);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #231709;
            font-weight: 900;
            border: 4px solid #ffdbb5;
            box-shadow: 0 0 30px #ffaa33, 0 0 40px #fcb42e inset;
            font-size: 18px;
            text-align: center;
            line-height: 1.3;
            cursor: pointer;
            transition: 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .center-logo:hover {
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 0 40px #ffb347;
        }
        .center-logo:active {
            transform: translate(-50%, -50%) scale(0.92);
        }

        /* 右侧图片区域 — 浮光相框 */
        .prize-image {
            flex: 0 0 300px;
            max-width: 340px;
            min-height: 300px;
            border-radius: 40px;
            background: rgba(0,0,0,0.2);
            box-shadow: 0 25px 35px -8px black, 0 0 0 4px #ca9e5a, 0 0 0 10px #4a3722;
            object-fit: cover;
            display: none;
            border: 2px solid #fde6b6;
        }

        /* 表单 — 磨砂水晶 */
        .info-form {
            display: none;
            background: rgba(25, 20, 40, 0.7);
            backdrop-filter: blur(18px);
            border: 1px solid #ffd966;
            padding: 25px;
            border-radius: 36px;
            margin: 20px auto 0;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 30px #0000004d;
        }

        .form-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffdb9d;
            font-weight: 600;
            text-shadow: 0 2px 5px #b45100;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #ffcfaa;
            padding-left: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 44px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            border: 2px solid transparent;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .form-group input:focus {
            border-color: #ffaa33;
            outline: none;
            background: #fff;
        }

        .submit-btn {
            background: linear-gradient(145deg, #f7b851, #ff9533);
            border: none;
            padding: 14px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #2d1704;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
            box-shadow: 0 10px 15px #211007;
            border: 2px solid #ffcf7a;
        }

        .submit-btn:hover {
            transform: translateY(-4px);
            background: linear-gradient(145deg, #ffc76b, #ffa64b);
            box-shadow: 0 15px 20px #140b04;
        }

        .success-message, .error-message {
            font-weight: bold;
            margin-top: 15px;
            display: none;
            font-size: 18px;
        }
        .success-message { color: #9bff9b; text-shadow: 0 0 6px #0f0; }
        .error-message { color: #ff8a8a; }

        /* 结果框 — 华丽面板 */
        .result {
            margin-top: 25px;
            font-size: 30px;
            min-height: 70px;
            font-weight: 800;
            text-shadow: 0 3px 8px #d06800;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 25px;
            border-radius: 70px;
            border: 2px solid #ffb347;
            box-shadow: 0 0 20px #ff8c1a inset;
            color: #fff1d0;
            letter-spacing: 1px;
        }

        .spin-button {
            background: linear-gradient(145deg, #fdad5c, #f07c3c);
            border: none;
            padding: 18px 60px;
            font-size: 28px;
            font-weight: 800;
            color: #221000;
            border-radius: 80px;
            cursor: pointer;
            margin: 20px 0 10px;
            box-shadow: 0 15px 0 #8f471f, 0 15px 30px black;
            transition: 0.1s ease;
            border: 3px solid #ffd58c;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .spin-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 19px 0 #8f471f, 0 20px 30px black;
        }

        .spin-button:active {
            transform: translateY(10px);
            box-shadow: 0 5px 0 #8f471f, 0 15px 25px black;
        }

        .spin-button:disabled {
            opacity: 0.6;
            transform: translateY(5px);
            box-shadow: 0 10px 0 #5a3a1f;
            cursor: not-allowed;
        }

        .redirect-notice {
            margin-top: 15px;
            font-size: 20px;
            color: #ffd966;
            font-weight: 600;
            display: none;
            background: #00000040;
            padding: 8px 20px;
            border-radius: 40px;
        }

        .note {
            margin-top: 25px;
            font-size: 15px;
            color: #ccb58b;
        }

        /* 彩屑 */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.8;
            border-radius: 0;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes fall {
            from { transform: translateY(-200px) rotate(0deg); }
            to { transform: translateY(120vh) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 700px) {
            .wheel { width: 280px; height: 280px; }
            .wheel-section { padding-left: 40px; font-size: 12px; }
            .center-logo { width: 60px; height: 60px; font-size: 14px; }
            .spin-button { font-size: 22px; padding: 14px 35px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>幸运大转盘</h1>

        <div class="content">
            <div class="wheel-container">
                <div class="pointer"></div>
                <div class="wheel" id="wheel">
                    <div class="wheel-section">14 Pro max</div>
                    <div class="wheel-section">加入qq群</div>
                    <div class="wheel-section">国家反诈中心</div>
                    <div class="wheel-section">2025元</div>
                    <div class="wheel-section">16 Pro max</div>
                    <div class="wheel-section">15 Pro max</div>
                    <div class="center-logo" id="centerLogo">幸运<br>抽奖</div>
                </div>
            </div>

            <!-- 奖品展示区：QQ群图片使用 xqm.png -->
            <img id="qq-image" class="prize-image" src="xqm.png" alt="QQ群二维码" onerror="this.src='https://via.placeholder.com/400x300/ff9966/333333?text=xqm.png'">
        </div>

        <!-- 地址表单 (实物/手机) -->
        <div class="info-form" id="addressForm">
            <div class="form-title">📦 请填写收货信息</div>
            <div class="form-group">
                <label for="phone">📱 手机号</label>
                <input type="tel" id="phone" placeholder="请输入您的手机号">
            </div>
            <div class="form-group">
                <label for="address">🏠 收货地址</label>
                <input type="text" id="address" placeholder="请输入收货地址">
            </div>
            <button class="submit-btn" id="submitAddress">✨ 提交信息 ✨</button>
            <div class="success-message" id="addressSuccess">✅ 信息提交成功！</div>
            <div class="error-message" id="addressError">❌ 提交失败，请重试</div>
        </div>

        <!-- 中奖信息表单 (2025元) -->
        <div class="info-form" id="winnerForm">
            <div class="form-title">💰 恭喜中奖！请填写联系方式</div>
            <div class="form-group">
                <label for="winnerPhone">📱 手机号</label>
                <input type="tel" id="winnerPhone" placeholder="手机号">
            </div>
            <div class="form-group">
                <label for="wechat">💬 微信号</label>
                <input type="text" id="wechat" placeholder="微信号">
            </div>
            <button class="submit-btn" id="submitWinner">💎 提交信息 💎</button>
            <div class="success-message" id="winnerSuccess">✅ 信息提交成功！</div>
            <div class="error-message" id="winnerError">❌ 提交失败，请重试</div>
        </div>

        <button class="spin-button" id="spin">开始抽奖</button>

        <div class="result" id="result"></div>
        <div class="redirect-notice" id="redirectNotice">⚠️ 即将跳转至国家反诈中心官网...</div>

        <!-- 完全移除次数显示和开发者模式相关元素 -->
        <!-- 无音乐控制按钮，音乐自动播放 -->

        <div class="note">✨ 幸运轮盘 · 结果以最终指向为准 ✨</div>
    </div>

    <!-- 背景音乐 (自动播放, 无控制按钮) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="lge.mp3" type="audio/mp3">
        您的浏览器不支持音频元素。
    </audio>

    <script>
        (function() {
            // ---------- 自动播放音乐 (并移除所有控制) ----------
            const bgMusic = document.getElementById('bgMusic');
            // 设置音量适中
            bgMusic.volume = 0.5;

            // 强力自动播放：页面加载、任何触摸、任何点击都可能触发
            function attemptAutoPlay() {
                bgMusic.play().then(() => {
                    console.log('音乐自动播放成功');
                }).catch(e => {
                    console.log('自动播放被阻止，但会在首次交互时播放');
                    // 只需要一次交互，下面的全局事件会处理
                });
            }

            // 立即尝试 (部分浏览器支持)
            attemptAutoPlay();

            // 用户首次点击任意地方都尝试播放 (保证最终能响)
            const firstInteraction = () => {
                bgMusic.play().catch(() => {});
                document.removeEventListener('click', firstInteraction);
                document.removeEventListener('touchstart', firstInteraction);
            };
            document.addEventListener('click', firstInteraction);
            document.addEventListener('touchstart', firstInteraction);

            // ---------- 核心变量 ----------
            const wheel = document.getElementById('wheel');
            const spinButton = document.getElementById('spin');
            const resultDiv = document.getElementById('result');
            const qqImage = document.getElementById('qq-image');
            const redirectNotice = document.getElementById('redirectNotice');

            // 表单元素
            const addressForm = document.getElementById('addressForm');
            const winnerForm = document.getElementById('winnerForm');
            const submitAddress = document.getElementById('submitAddress');
            const submitWinner = document.getElementById('submitWinner');
            const addressSuccess = document.getElementById('addressSuccess');
            const addressError = document.getElementById('addressError');
            const winnerSuccess = document.getElementById('winnerSuccess');
            const winnerError = document.getElementById('winnerError');

            // 中心logo (无开发者模式功能, 仅保留样式)
            const centerLogo = document.getElementById('centerLogo');

            let spinning = false;
            let currentPrize = null;

            // 国家反诈中心网址
            const antifraudWebsite = "https://cyberpolice.mps.gov.cn/";

            // 奖项配置 (与转盘文字完全对应)
            const prizes = [
                { name: "14 Pro max", angle: 0, type: "device" },
                { name: "加入qq群", angle: 60, type: "qq" },
                { name: "国家反诈中心", angle: 120, type: "redirect" },
                { name: "2025元", angle: 180, type: "money" },
                { name: "16 Pro max", angle: 240, type: "device" },
                { name: "15 Pro max", angle: 300, type: "device" }
            ];

            // 随机选择 (等概率)
            function getRandomPrize() {
                const randomIndex = Math.floor(Math.random() * prizes.length);
                return prizes[randomIndex];
            }

            // 彩屑
            function createConfetti() {
                const colors = ['#FFD700', '#FFA500', '#FF69B4', '#00FFFF', '#ADFF2F', '#FF4500'];
                for (let i = 0; i < 40; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (6 + Math.random() * 12) + 'px';
                    confetti.style.height = (6 + Math.random() * 12) + 'px';
                    confetti.style.animation = `fall ${3 + Math.random() * 5}s linear forwards`;
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 8000);
                }
            }

            // 模拟保存信息 (仅控制台)
            async function saveInfoToServer(data, type) {
                console.log(`[${type}] 信息:`, data);
                return { success: true };
            }

            // 提交地址
            submitAddress.addEventListener('click', async function() {
                const phone = document.getElementById('phone').value.trim();
                const addr = document.getElementById('address').value.trim();
                if (!phone || !addr) {
                    addressError.textContent = "请填写完整信息";
                    addressError.style.display = "block";
                    setTimeout(() => addressError.style.display = "none", 2000);
                    return;
                }
                if (!/^1[3-9]\d{9}$/.test(phone)) {
                    addressError.textContent = "手机号格式不对";
                    addressError.style.display = "block";
                    setTimeout(() => addressError.style.display = "none", 2000);
                    return;
                }
                const res = await saveInfoToServer({ phone, address: addr, prize: currentPrize?.name }, 'address');
                if (res.success) {
                    addressSuccess.style.display = "block";
                    addressForm.style.display = "none";
                    setTimeout(() => addressSuccess.style.display = "none", 2000);
                } else {
                    addressError.style.display = "block";
                    setTimeout(() => addressError.style.display = "none", 2000);
                }
            });

            // 提交中奖信息 (2025元)
            submitWinner.addEventListener('click', async function() {
                const phone = document.getElementById('winnerPhone').value.trim();
                const wechat = document.getElementById('wechat').value.trim();
                if (!phone || !wechat) {
                    winnerError.textContent = "请填写完整信息";
                    winnerError.style.display = "block";
                    setTimeout(() => winnerError.style.display = "none", 2000);
                    return;
                }
                if (!/^1[3-9]\d{9}$/.test(phone)) {
                    winnerError.textContent = "手机号无效";
                    winnerError.style.display = "block";
                    setTimeout(() => winnerError.style.display = "none", 2000);
                    return;
                }
                const res = await saveInfoToServer({ phone, wechat, prize: currentPrize?.name }, 'winner');
                if (res.success) {
                    winnerSuccess.style.display = "block";
                    winnerForm.style.display = "none";
                    setTimeout(() => winnerSuccess.style.display = "none", 2000);
                } else {
                    winnerError.style.display = "block";
                    setTimeout(() => winnerError.style.display = "none", 2000);
                }
            });

            // 转盘逻辑
            function spinWheel() {
                if (spinning) return;
                spinning = true;
                spinButton.disabled = true;
                resultDiv.textContent = "转盘飞旋...";
                redirectNotice.style.display = "none";
                qqImage.style.display = "none";
                addressForm.style.display = "none";
                winnerForm.style.display = "none";

                // 随机选中奖项 (真正的随机)
                const selectedPrize = getRandomPrize();
                currentPrize = selectedPrize;

                // 旋转角度计算 (使指针指向对应扇区中间)
                const extraRotations = 6;
                // 指针在中心, 需要将扇区起始边对准指针方向, 微调让结果美观
                const targetAngle = 360 * extraRotations + (360 - selectedPrize.angle) + 28; 

                wheel.style.transition = 'none';
                wheel.style.transform = `rotate(0deg)`;
                void wheel.offsetWidth;
                wheel.style.transition = 'transform 4s cubic-bezier(0.23, 1, 0.32, 1)';
                wheel.style.transform = `rotate(${targetAngle}deg)`;

                setTimeout(() => {
                    resultDiv.textContent = `🏆 恭喜您抽中了: ${selectedPrize.name} 🏆`;

                    // 根据类型展示不同的反馈
                    if (selectedPrize.type === "redirect") {
                        redirectNotice.style.display = "block";
                        setTimeout(() => {
                            window.location.href = antifraudWebsite;
                        }, 2200);
                    } 
                    else if (selectedPrize.type === "qq") {
                        qqImage.style.display = "block";
                        createConfetti();
                    } 
                    else if (selectedPrize.type === "device") {
                        addressForm.style.display = "block";
                        createConfetti();
                    } 
                    else if (selectedPrize.type === "money") {
                        winnerForm.style.display = "block";
                        createConfetti();
                    } 
                    else {
                        createConfetti();
                    }

                    spinning = false;
                    spinButton.disabled = false;  // 无限制, 永远可用
                }, 4100);
            }

            spinButton.addEventListener('click', spinWheel);

            // 中心logo点击仅好玩 (无开发者模式)
            centerLogo.addEventListener('click', function() {
                createConfetti();  // 点中心也撒花，有趣
            });

            // 移除所有次数显示元素 (之前隐藏)
            // 确保任何潜在的计数器都不显示
            const oldCounter = document.querySelector('.counter');
            if (oldCounter) oldCounter.style.display = 'none';
            const oldDevCount = document.querySelector('.dev-mode-count');
            if (oldDevCount) oldDevCount.style.display = 'none';
            const oldLimitNotice = document.querySelector('.limit-notice');
            if (oldLimitNotice) oldLimitNotice.style.display = 'none';
            const oldDevNotice = document.querySelector('.dev-mode-notice');
            if (oldDevNotice) oldDevNotice.style.display = 'none';
        })();
    </script>
</body>
</html>
