<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运大转盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            background: linear-gradient(to right, #ff9966, #ff5e62);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
        }
        .wheel-container {
            flex: 1;
            min-width: 300px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wheel {
            width: 300px;
            height: 300px;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            transform: rotate(0deg);
            box-shadow: 0 0 0 10px #ffd700, 0 0 20px rgba(0, 0, 0, 0.3);
        }
        .wheel-section {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: bottom right;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 60px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            color: #333;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
            border-right: 1px solid rgba(0,0,0,0.1);
        }
        .wheel-section:nth-child(1) {
            background-color: #ff9999;
            transform: rotate(0deg);
        }
        .wheel-section:nth-child(2) {
            background-color: #99ff99;
            transform: rotate(60deg);
        }
        .wheel-section:nth-child(3) {
            background-color: #9999ff;
            transform: rotate(120deg);
        }
        .wheel-section:nth-child(4) {
            background-color: #ffff99;
            transform: rotate(180deg);
        }
        .wheel-section:nth-child(5) {
            background-color: #ff99ff;
            transform: rotate(240deg);
        }
        .wheel-section:nth-child(6) {
            background-color: #99ffff;
            transform: rotate(300deg);
        }
        /* 指针样式 */
        .pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            z-index: 10;
        }
        .pointer::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid #ff3300;
        }
        .pointer::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background-color: #ff3300;
            border-radius: 50%;
            z-index: 11;
        }
        .center-logo {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            border: 4px solid #ffd700;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            font-size: 12px;
            text-align: center;
            line-height: 1.2;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .center-logo:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
        .center-logo:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
        .spin-button {
            background: linear-gradient(to right, #ff9966, #ff5e62);
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .spin-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .spin-button:active {
            transform: translateY(1px);
        }
        .spin-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 30px;
            font-size: 26px;
            min-height: 40px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .note {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }
        .prize-image {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            display: none;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 3px solid #ffd700;
        }
        .redirect-notice {
            margin-top: 15px;
            font-size: 16px;
            color: #ffeb3b;
            display: none;
        }
        /* 信息收集表单样式 - 简化 */
        .info-form {
            display: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            margin: 20px auto;
            width: 100%;
            max-width: 400px;
        }
        .form-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #ffeb3b;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .submit-btn {
            background: linear-gradient(to right, #4CAF50, #8BC34A);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }
        .success-message {
            color: #4CAF50;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
        .error-message {
            color: #ff5252;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>幸运大转盘</h1>
        
        <div class="content">
            <div class="wheel-container">
                <div class="pointer"></div>
                <div class="wheel" id="wheel">
                    <div class="wheel-section">14 Pro max</div>
                    <div class="wheel-section">加入qq群</div>
                    <div class="wheel-section">国家反诈中心</div>
                    <div class="wheel-section">2025元</div>
                    <div class="wheel-section">16 Pro max</div>
                    <div class="wheel-section">15 Pro max</div>
                    <div class="center-logo" id="centerLogo">幸运<br>抽奖</div>
                </div>
            </div>
            
            <img id="qq-image" class="prize-image" src="xqm.png" alt="QQ群二维码" onerror="this.src='https://via.placeholder.com/400x300/ff9999/333333?text=xqm.png'">
        </div>
        
        <!-- 收货信息表单 -->
        <div class="info-form" id="addressForm">
            <div class="form-title">请填写收货信息</div>
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" placeholder="请输入您的手机号">
            </div>
            <div class="form-group">
                <label for="address">收货地址</label>
                <input type="text" id="address" placeholder="请输入您的收货地址">
            </div>
            <button class="submit-btn" id="submitAddress">提交信息</button>
            <div class="success-message" id="addressSuccess">信息提交成功！</div>
            <div class="error-message" id="addressError">提交失败，请重试</div>
        </div>
        
        <!-- 中奖信息表单 -->
        <div class="info-form" id="winnerForm">
            <div class="form-title">恭喜您中奖！请填写联系方式</div>
            <div class="form-group">
                <label for="winnerPhone">手机号</label>
                <input type="tel" id="winnerPhone" placeholder="请输入您的手机号">
            </div>
            <div class="form-group">
                <label for="wechat">微信号</label>
                <input type="text" id="wechat" placeholder="请输入您的微信号">
            </div>
            <button class="submit-btn" id="submitWinner">提交信息</button>
            <div class="success-message" id="winnerSuccess">信息提交成功！</div>
            <div class="error-message" id="winnerError">提交失败，请重试</div>
        </div>
        
        <button class="spin-button" id="spin">开始抽奖</button>
        
        <div class="result" id="result"></div>
        <div class="redirect-notice" id="redirectNotice">即将跳转到国家反诈中心官方网站...</div>
        
        <div class="note">注：抽奖结果以转盘最终指向为准</div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="lge.mp3" type="audio/mp3">
        您的浏览器不支持音频元素。
    </audio>

    <script>
        (function() {
            // ========== 音乐自动播放（无控制按钮）==========
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.4; // 设置合适音量
            
            // 播放函数
            function playMusic() {
                bgMusic.play().then(() => {
                    console.log('音乐播放成功');
                }).catch(e => {
                    console.log('自动播放失败，将在用户交互后播放', e);
                    // 如果自动播放失败，监听首次点击
                    if (!window.musicAttempted) {
                        window.musicAttempted = true;
                        const playOnFirstTouch = function() {
                            bgMusic.play().catch(() => {});
                            document.removeEventListener('click', playOnFirstTouch);
                            document.removeEventListener('touchstart', playOnFirstTouch);
                        };
                        document.addEventListener('click', playOnFirstTouch);
                        document.addEventListener('touchstart', playOnFirstTouch);
                    }
                });
            }
            
            // 立即尝试播放
            setTimeout(playMusic, 500);
            // 页面加载完成也尝试
            window.addEventListener('load', function() {
                setTimeout(playMusic, 800);
            });

            // ========== 转盘逻辑 ==========
            const wheel = document.getElementById('wheel');
            const spinButton = document.getElementById('spin');
            const resultDiv = document.getElementById('result');
            const qqImage = document.getElementById('qq-image');
            const redirectNotice = document.getElementById('redirectNotice');
            
            // 表单元素
            const addressForm = document.getElementById('addressForm');
            const winnerForm = document.getElementById('winnerForm');
            const addressSuccess = document.getElementById('addressSuccess');
            const addressError = document.getElementById('addressError');
            const winnerSuccess = document.getElementById('winnerSuccess');
            const winnerError = document.getElementById('winnerError');
            const submitAddress = document.getElementById('submitAddress');
            const submitWinner = document.getElementById('submitWinner');
            
            // 国家反诈中心网址
            const antifraudWebsite = "https://cyberpolice.mps.gov.cn/";
            
            let spinning = false;
            let currentPrize = null;
            
            // 奖项配置 - 与转盘上的文字完全一致，顺序对应
            // 概率设置：加入qq群 50%，国家反诈中心 40%，其他四个各 2.5%
            const prizes = [
                { name: "14 Pro max", angle: 0, type: "device", probability: 0.025 },
                { name: "加入qq群", angle: 60, type: "qq", probability: 0.5 },
                { name: "国家反诈中心", angle: 120, type: "redirect", probability: 0.4 },
                { name: "2025元", angle: 180, type: "money", probability: 0.025 },
                { name: "16 Pro max", angle: 240, type: "device", probability: 0.025 },
                { name: "15 Pro max", angle: 300, type: "device", probability: 0.025 }
            ];
            
            // 根据概率选择奖项
            function getPrizeByProbability() {
                const random = Math.random();
                let cumulative = 0;
                
                for (let i = 0; i < prizes.length; i++) {
                    cumulative += prizes[i].probability;
                    if (random < cumulative) {
                        return prizes[i];
                    }
                }
                // 防溢出
                return prizes[1]; // 默认返回qq群
            }
            
            // 提交地址表单
            submitAddress.addEventListener('click', function() {
                const phone = document.getElementById('phone').value.trim();
                const address = document.getElementById('address').value.trim();
                
                if (!phone || !address) {
                    addressError.textContent = "请填写完整信息";
                    addressError.style.display = "block";
                    setTimeout(() => addressError.style.display = "none", 2000);
                    return;
                }
                
                if (!/^1[3-9]\d{9}$/.test(phone)) {
                    addressError.textContent = "手机号格式不正确";
                    addressError.style.display = "block";
                    setTimeout(() => addressError.style.display = "none", 2000);
                    return;
                }
                
                // 模拟提交成功
                console.log('地址信息:', { phone, address, prize: currentPrize?.name });
                addressSuccess.style.display = "block";
                addressForm.style.display = "none";
                setTimeout(() => addressSuccess.style.display = "none", 2000);
            });
            
            // 提交中奖信息
            submitWinner.addEventListener('click', function() {
                const phone = document.getElementById('winnerPhone').value.trim();
                const wechat = document.getElementById('wechat').value.trim();
                
                if (!phone || !wechat) {
                    winnerError.textContent = "请填写完整信息";
                    winnerError.style.display = "block";
                    setTimeout(() => winnerError.style.display = "none", 2000);
                    return;
                }
                
                if (!/^1[3-9]\d{9}$/.test(phone)) {
                    winnerError.textContent = "手机号格式不正确";
                    winnerError.style.display = "block";
                    setTimeout(() => winnerError.style.display = "none", 2000);
                    return;
                }
                
                console.log('中奖信息:', { phone, wechat, prize: currentPrize?.name });
                winnerSuccess.style.display = "block";
                winnerForm.style.display = "none";
                setTimeout(() => winnerSuccess.style.display = "none", 2000);
            });
            
            // 抽奖函数
            function spinWheel() {
                if (spinning) return;
                
                spinning = true;
                spinButton.disabled = true;
                resultDiv.textContent = "转盘中...";
                redirectNotice.style.display = "none";
                
                // 隐藏所有可能显示的内容
                qqImage.style.display = "none";
                addressForm.style.display = "none";
                winnerForm.style.display = "none";
                
                // 根据概率选择奖项
                const selectedPrize = getPrizeByProbability();
                currentPrize = selectedPrize;
                
                // 计算旋转角度 - 确保指针指向该奖项
                // 转盘有6个扇区，每个60度，指针在中心
                // 需要多转几圈增加随机感
                const extraRotations = 5; // 5圈
                // 计算目标角度：让转盘停在选中奖项的扇区中央（角度偏移30度）
                // 奖项angle是扇区起始边，中心线是angle+30度
                // 指针向上为0度，转盘顺时针转，需要将扇区中心线转到指针方向
                const targetAngle = 360 * extraRotations + (360 - (selectedPrize.angle + 30));
                
                // 重置转盘位置
                wheel.style.transition = 'none';
                wheel.style.transform = `rotate(0deg)`;
                void wheel.offsetWidth; // 强制重绘
                
                // 设置旋转动画
                wheel.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.83, 0.67)';
                wheel.style.transform = `rotate(${targetAngle}deg)`;
                
                // 动画结束后显示结果
                setTimeout(function() {
                    resultDiv.textContent = `恭喜您抽中了: ${selectedPrize.name}`;
                    
                    // 根据奖项类型显示对应内容
                    if (selectedPrize.type === "redirect") {
                        redirectNotice.style.display = "block";
                        setTimeout(function() {
                            window.location.href = antifraudWebsite;
                        }, 2000);
                    } 
                    else if (selectedPrize.type === "qq") {
                        qqImage.style.display = "block";
                    } 
                    else if (selectedPrize.type === "device") {
                        addressForm.style.display = "block";
                    } 
                    else if (selectedPrize.type === "money") {
                        winnerForm.style.display = "block";
                    }
                    
                    spinning = false;
                    spinButton.disabled = false;
                }, 4200);
            }
            
            // 绑定抽奖按钮
            spinButton.addEventListener('click', spinWheel);
            
            // 中心logo点击撒花效果（纯装饰）
            const centerLogo = document.getElementById('centerLogo');
            centerLogo.addEventListener('click', function() {
                // 简单的撒花效果，用控制台代替
                console.log('✨ 幸运撒花 ✨');
            });
        })();
    </script>
</body>
</html>
